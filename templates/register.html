<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Register - StudySync</title>
</head>

<body>

    <div class="container" id="container">
        <!-- Left Side Overlay Container -->
        <div class="toggle-container" style="width: 50%; left: 0;">
            <div class="toggle">
                <div class="toggle-panel toggle-left" style="transform: translateX(0);">
                    <h1>Welcome Back!</h1>
                    <p>Already have an account? Sign in with your details.</p>
                    <a href="{{ url_for('login') }}">
                        <button type="button" class="hidden">Sign In</button>
                    </a>
                </div>
            </div>
        </div>

        <!-- Register Form (Right Side) -->
        <div class="form-container sign-up" style="width: 50%; left: 50%; opacity: 1; z-index: 5;">
            <form action="{{ url_for('register') }}" method="POST">
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="icons"><i class="bx bxl-google"></i></a>
                    <a href="#" class="icons"><i class="bx bxl-facebook"></i></a>
                    <a href="#" class="icons"><i class="bx bxl-github"></i></a>
                    <a href="#" class="icons"><i class="bx bxl-linkedin"></i></a>
                </div>
                <span>Register with E-mail</span>

                <!-- STEP 3: Flash Messages Block -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div style="color: #4dff5c; font-size: 13px; margin: 8px 0; font-weight: bold; text-align: center;">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Enter E-mail" required>
                <input type="password" name="password" placeholder="Enter New Password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>

</body>

</html>

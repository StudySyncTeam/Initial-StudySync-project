<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Login - StudySync</title>
</head>

<body>

    <div class="container" id="container">
        <!-- Sign In Form -->
        <div class="form-container sign-in" style="width: 50%; left: 0;">
            <form action="{{ url_for('login') }}" method="POST">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icons"><i class="bx bxl-google"></i></a>
                    <a href="#" class="icons"><i class="bx bxl-facebook"></i></a>
                    <a href="#" class="icons"><i class="bx bxl-github"></i></a>
                    <a href="#" class="icons"><i class="bx bxl-linkedin"></i></a>
                </div>
                <span>Login With Email & Password</span>
                <input type="email" name="email" placeholder="Enter E-mail" required>
                <input type="password" name="password" placeholder="Enter Password" required>
                <a href="#">Forgot Password?</a>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- Right Side Overlay Container -->
        <div class="toggle-container" style="left: 50%; width: 50%;">
            <div class="toggle">
                <div class="toggle-panel toggle-right">
                    <h1>Welcome to StudySync!</h1>
                    <p>Your ultimate academic co-pilot!</p>
                    <a href="{{ url_for('register') }}" class="button-link">
                        <button type="button" class="hidden">Sign Up</button>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
